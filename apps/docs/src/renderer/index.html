<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        // 1. 어떤 속성을 호출해도 에러 없이 자기 자신 또는 안전한 값을 무한 반환하는 만능 프록시 팩토리
        function createDeepProxy(name = 'root') {
          const noop = () => {};
          const dummyTarget = Object.assign(() => Promise.resolve(createDeepProxy()), {
            queuePlaceholder: "문서를 편집하거나 AI에게 요청하세요...",
            placeholder: "명령어를 입력하세요...",
            name: "Default",
            id: "default",
            model: "default-model",
            provider: "custom",
            customEndpoint: "",
            customEndpoints: [],
            modelProfiles: {},
            theme: "light",
            language: "ko"
          });

          return new Proxy(dummyTarget, {
            get(target, prop) {
              if (prop === Symbol.toPrimitive || prop === 'toString') return () => "";
              if (prop === 'valueOf') return () => 0;
              if (prop === 'then') return undefined; // Promise 체이닝 오작동 방지
              if (prop in target) return target[prop];

              // 이벤트 리스너 해제 함수(cleanup) 대응
              if (typeof prop === 'string' && prop.startsWith('on')) {
                return () => noop;
              }

              // 그 외 모든 하위 프로퍼티 조회에 대해 다시 깊은 프록시 반환
              return createDeepProxy(`${name}.${String(prop)}`);
            },
            apply(target, thisArg, argArray) {
              // 함수로 실행될 경우 항상 안전한 Promise 또는 프록시 반환
              return Promise.resolve(createDeepProxy());
            }
          });
        }

        const universalMock = createDeepProxy('desktop');

        // 2. 브라우저 전역 객체 완전 방어
        window.desktop = universalMock;
        window.api = universalMock;
        window.electron = universalMock;

        // 3. Q9[E] 같은 객체 인덱싱 에러 원천 차단 (프로토타입 수준 방어)
        try {
          Object.defineProperty(Object.prototype, "queuePlaceholder", {
            get() { return "문서를 편집하거나 AI에게 요청하세요..."; },
            set() {},
            configurable: true
          });
        } catch (e) {}

        // 4. 로컬 스토리지 클린업
        try {
          localStorage.setItem('theme', 'light');
          localStorage.setItem('locale', 'ko');
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IeumOffice Docs</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
