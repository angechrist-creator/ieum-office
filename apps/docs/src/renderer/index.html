<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        const noop = () => {};

        // 가짜 데이터 사전 (함수 객체에 직접 assign하지 않고 분리하여 읽기 전용 충돌 방지)
        const defaultValues = {
          queuePlaceholder: "문서를 편집하세요...",
          placeholder: "입력하세요...",
          name: "Default",
          id: "default",
          provider: "custom",
          customEndpoint: "",
          customEndpoints: [],
          model: "default",
          modelProfiles: {},
          theme: "light",
          language: "ko"
        };

        function createSafeProxy(proxyName = 'root') {
          const dummyFn = function() {
            return Promise.resolve(createSafeProxy());
          };

          return new Proxy(dummyFn, {
            get(target, prop) {
              if (prop === Symbol.toPrimitive || prop === 'toString') return () => "";
              if (prop === 'valueOf') return () => 0;
              if (prop === 'then') return undefined; // Promise 체인 오작동 차단

              // 기본 설정값 반환
              if (typeof prop === 'string' && prop in defaultValues) {
                return defaultValues[prop];
              }

              // React useEffect 내 리스너 해제 함수(cleanup) 대응
              if (typeof prop === 'string' && prop.startsWith('on')) {
                return () => noop;
              }

              return createSafeProxy(`${proxyName}.${String(prop)}`);
            },
            apply(target, thisArg, argArray) {
              return Promise.resolve(createSafeProxy());
            }
          });
        }

        const safeDesktop = createSafeProxy('desktop');

        // 전역 객체 바인딩
        window.desktop = safeDesktop;
        window.api = safeDesktop;
        window.electron = safeDesktop;

        // Q9[E] 인덱싱 에러 프로토타입 방어막
        try {
          Object.defineProperty(Object.prototype, "queuePlaceholder", {
            get() { return "문서를 편집하세요..."; },
            set() {},
            configurable: true
          });
        } catch (e) {}

        // 로컬스토리지 기본값 주입
        try {
          localStorage.setItem('theme', 'light');
          localStorage.setItem('locale', 'ko');
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IeumOffice Docs</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
