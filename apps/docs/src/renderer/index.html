<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script>
      // 1. 브라우저 실행 시 Electron 전용 desktop API 충돌 방지 Mock 객체
      const noop = () => {};

      // 2. Q9[E]에 없는 AI 이름이 들어와도 queuePlaceholder 오류가 나지 않도록 프로토타입 방어막 주입
      const defaultAIProvider = {
        queuePlaceholder: "AI 요청을 입력하세요...",
        placeholder: "AI 요청을 입력하세요...",
        name: "AI",
        id: "default"
      };
      ["none", "openai", "custom", "local", "anthropic", "gemini", "ollama", "", "undefined", "null"].forEach(key => {
        try {
          Object.defineProperty(Object.prototype, key, {
            value: defaultAIProvider,
            writable: true,
            configurable: true
          });
        } catch (e) {}
      });

      // 3. 앱이 요구하는 기본 설정 객체
      const defaultSettings = {
        provider: "custom",
        customEndpoint: "",
        customEndpoints: [],
        model: "",
        modelProfiles: {},
        language: "ko",
        theme: "light"
      };

      const mockHandler = {
        get(target, prop) {
          if (prop in target) return target[prop];
          
          if (typeof prop === 'string' && prop.startsWith('on')) {
            return () => noop;
          }
          
          if (typeof prop === 'string' && (prop.startsWith('get') || prop.includes('Config') || prop.includes('Setting'))) {
            return () => Promise.resolve(defaultSettings);
          }

          return () => Promise.resolve({});
        }
      };

      window.desktop = new Proxy({
        armContextMenu: noop,
        onContextMenuRequest: () => noop,
        onLanguageChanged: () => noop,
        getSystemTheme: () => 'light',
        onThemeChanged: () => noop,
        openExternal: (url) => window.open(url, '_blank'),
        readFile: () => Promise.resolve(null),
        writeFile: () => Promise.resolve(true),
        getSettings: () => Promise.resolve(defaultSettings),
        getConfig: () => Promise.resolve(defaultSettings),
      }, mockHandler);

      window.api = window.desktop;
      window.electron = window.desktop;
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IeumOffice Docs</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
