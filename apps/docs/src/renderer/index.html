<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        // 1. 재귀적 만능 프록시: 어떤 프로퍼티/메서드가 호출되어도 에러 없이 안전한 값을 반환
        const noop = () => {};
        
        function createSafeProxy(name = 'root') {
          const baseTarget = Object.assign(() => Promise.resolve(createSafeProxy()), {
            queuePlaceholder: "문서를 편집하세요...",
            placeholder: "입력하세요...",
            name: "Default",
            id: "default",
            provider: "custom",
            customEndpoint: "",
            customEndpoints: [],
            model: "default",
            modelProfiles: {},
            theme: "light",
            language: "ko"
          });

          return new Proxy(baseTarget, {
            get(target, prop) {
              if (prop === Symbol.toPrimitive || prop === 'toString') return () => "";
              if (prop === 'valueOf') return () => 0;
              if (prop === 'then') return undefined; // Promise 체인 오작동 방지
              if (prop in target) return target[prop];

              // 이벤트 리스너 해제 함수(cleanup) 대응
              if (typeof prop === 'string' && prop.startsWith('on')) {
                return () => noop;
              }

              return createSafeProxy(`${name}.${String(prop)}`);
            },
            apply(target, thisArg, argArray) {
              return Promise.resolve(createSafeProxy());
            }
          });
        }

        const universalMock = createSafeProxy('desktop');

        // 2. 브라우저 전역 객체 바인딩
        window.desktop = universalMock;
        window.api = universalMock;
        window.electron = universalMock;

        // 3. 프로토타입 수준 방어막 (Q9[E] 등 배열/객체 직접 인덱싱 오류 방지)
        try {
          Object.defineProperty(Object.prototype, "queuePlaceholder", {
            get() { return "문서를 편집하세요..."; },
            set() {},
            configurable: true
          });
        } catch (e) {}

        // 4. 로컬 스토리지 초기화 방어
        try {
          localStorage.setItem('theme', 'light');
          localStorage.setItem('locale', 'ko');
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IeumOffice Docs</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
