<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script>
      // 브라우저 실행 시 Electron 전용 desktop API 충돌 방지 Mock 객체
      const noop = () => {};
      
      // 앱이 요구하는 기본 설정 객체 (provider 에러 방지)
      const defaultSettings = {
        provider: "none",
        customEndpoint: "",
        customEndpoints: [],
        model: "",
        modelProfiles: {},
        language: "ko",
        theme: "light"
      };

      const mockHandler = {
        get(target, prop) {
          if (prop in target) return target[prop];
          
          // 이벤트 리스너(on...)는 cleanup 함수(noop)를 반환
          if (typeof prop === 'string' && prop.startsWith('on')) {
            return () => noop;
          }
          
          // get으로 시작하는 설정 요청 함수들은 null 대신 기본 설정 객체 반환
          if (typeof prop === 'string' && (prop.startsWith('get') || prop.includes('Config') || prop.includes('Setting'))) {
            return () => Promise.resolve(defaultSettings);
          }

          // 그 외 비동기 함수들도 안전하게 빈 객체 반환
          return () => Promise.resolve({});
        }
      };

      window.desktop = new Proxy({
        armContextMenu: noop,
        onContextMenuRequest: () => noop,
        onLanguageChanged: () => noop,
        getSystemTheme: () => 'light',
        onThemeChanged: () => noop,
        openExternal: (url) => window.open(url, '_blank'),
        readFile: () => Promise.resolve(null),
        writeFile: () => Promise.resolve(true),
        getSettings: () => Promise.resolve(defaultSettings),
        getConfig: () => Promise.resolve(defaultSettings),
      }, mockHandler);

      window.api = window.desktop;
      window.electron = window.desktop;

      // 브라우저 로컬스토리지에도 기본 설정이 없으면 미리 주입
      try {
        if (!localStorage.getItem('ai_config')) {
          localStorage.setItem('ai_config', JSON.stringify(defaultSettings));
        }
      } catch (e) {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IeumOffice Docs</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
