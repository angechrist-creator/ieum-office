name: Deploy OpenOffice Web

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 가져오기
        uses: actions/checkout@v4

      - name: Node 20 세팅
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 앱 설치 및 웹 번들 빌드
        run: |
          cd apps/docs
          npm install
          npx vite build --base=./

      - name: 웹 산출물 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./apps/docs/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 깃허브 웹페이지 배포
        id: deployment
        uses: actions/deploy-pages@v4
